# Builds the desktop apps: Windows (.exe) and macOS (.dmg).
# A pushed version tag (v1.0.0) also publishes them on the repository's Releases page;
# "Run workflow" on the Actions tab builds them as downloadable artifacts only, unless a version
# (v1.0.6) is given: then the release and its tag are created from the chosen branch, the same way
# as for a pushed tag.
name: Desktop builds

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Yayınlanacak sürüm (ör. v1.0.6). Boş bırakılırsa yalnızca derlenir.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            files: |
              release/*.exe
          - os: macos-latest
            target: --mac
            files: |
              release/*.dmg
    runs-on: ${{ matrix.os }}
    env:
      # No paid signing certificates: Windows builds are unsigned, macOS builds are ad-hoc signed.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm install rather than npm ci: the lockfile is written on Windows and may miss the
      # platform-specific optional packages macOS needs (rollup, lightningcss, esbuild).
      - run: npm install --no-audit --no-fund

      - run: npm run lint
      - run: npm test

      - run: npm run build:electron
      - run: npx electron-builder ${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: billingua-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.tag, 'v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*
          body: |
            ## İndirme

            - **Windows:** `Billingua-*-kurulum.exe` (kurulum) ya da `Billingua-*-portable.exe` (kurulumsuz, tek dosya)
            - **Mac (Intel ve Apple Silicon):** `Billingua-*-mac.dmg`

            Uygulamalar ücretli bir geliştirici sertifikasıyla imzalanmadığı için ilk açılışta uyarı çıkar:
            - **Windows:** "Windows bilgisayarınızı korudu" → **Ek bilgi** → **Yine de çalıştır**
            - **Mac:** Uygulamaya sağ tıklayın → **Aç** → **Aç**. "Hasarlı" uyarısı çıkarsa Terminal'de: `xattr -cr /Applications/Billingua.app`
